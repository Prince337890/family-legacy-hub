function ub64(s){ var b = atob(s), a = new Uint8Array(b.length); for (var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
async function unseal(pass){
  var enc = new TextEncoder();
  var km = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  var key = await crypto.subtle.deriveKey({name:"PBKDF2", salt: ub64(SALT), iterations: 600000, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, false, ["decrypt"]);

  return new TextDecoder().decode(pt);
}
var go = document.getElementById("go"), inp = document.getElementById("key"), err = document.getElementById("err");
async function attempt(){

  go.disabled = true; go.textContent = "Opening…"; err.textContent = "";
  try {
    var html = await unseal(pass);

    inp.value = ""; go.disabled = false; go.textContent = "Open";

}
