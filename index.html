function ub64(s){ var b = atob(s), a = new Uint8Array(b.length); for (var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
async function unsealRaw(pass, saltB, ivB, ctB){
  var enc = new TextEncoder();
  var km = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  var key = await crypto.subtle.deriveKey({name:"PBKDF2", salt: ub64(saltB), iterations: 600000, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  var pt = await crypto.subtle.decrypt({name:"AES-GCM", iv: ub64(ivB)}, key, ub64(ctB));
  return new TextDecoder().decode(pt);
}

function openHub(html, familyKey, isAdmin){

    (isAdmin ? ";window.__isAdmin=true" : "") + ";</scr" + "ipt>");
  document.open(); document.write(html); document.close();
}
async function attempt(){
  var pass = inp.value.trim().toLowerCase();
  if (!pass) return;
  go.disabled = true; go.textContent = "Opening…"; err.textContent = "";

    var html = await unsealRaw(pass, SALT, IV, CT);
